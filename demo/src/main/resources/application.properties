spring.application.name=dear
server.port=8080

# 같은 폴더(demo)의 .env 파일을 읽음 (없으면 그냥 넘어감)
spring.config.import=optional:file:.env[.properties]

# ── MySQL ──
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dear}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──
# 테이블은 Flyway가 만들고, JPA는 엔티티와 테이블이 맞는지만 확인함
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ── Flyway: src/main/resources/db/migration 의 V1__, V2__ ... 파일을 순서대로 실행 ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 손으로 만든 DB(기록 테이블 없음)에서도 동작: 기존 테이블을 V1로 보고 V2부터 실행
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ── JWT (코드에서 @Value("${jwt.secret}") 로 읽음) ──
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── 구글 로그인 (구글 로그인으로 확정되면 사용) ──
google.client-id=${GOOGLE_CLIENT_ID:}

# ── 사전 API (찾으면 채움) ──
dictionary.api-key=${DICTIONARY_API_KEY:}

# ── [개발용] X-User-Id 헤더로 로그인 없이 테스트 (DevUserIdFilter). 시연·배포 때는 반드시 false ──
dear.dev-auth.enabled=${DEV_AUTH:false}

# ── Swagger: http://localhost:8080/swagger-ui.html ──
springdoc.swagger-ui.path=/swagger-ui.html
