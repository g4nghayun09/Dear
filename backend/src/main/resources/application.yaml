google:
  client-id: ${GOOGLE_CLIENT_ID:}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: dear
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dear}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:}                         # 32자 이상. 없으면 서버가 시작되지 않음
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}  # 기본 7일
